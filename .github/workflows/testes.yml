name: Testes Automatizados API Carrefour

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes
        run: |
          robot -d results tests/

      - name: Gerar resumo dos testes
        if: always()
        run: |
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import xml.etree.ElementTree as ET

          root = ET.parse("results/output.xml").getroot()

          total = 0
          passed = 0
          failed = 0

          for test in root.iter("test"):
              total += 1

              status = test.find("status")

              if status is not None and status.get("status") == "PASS":
                  passed += 1
              else:
                  failed += 1

          print("## 🤖 Resultado dos testes")
          print("")
          print(f"| Resultado | Quantidade |")
          print(f"|---|---:|")
          print(f"| Total | {total} |")
          print(f"| ✅ Passaram | {passed} |")
          print(f"| ❌ Falharam | {failed} |")
          print("")

          if failed == 0:
              print("### ✅ Todos os testes passaram!")
          else:
              print("### ❌ Existem testes com falha.")
          PY

      - name: Publicar relatorios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-robot
          path: results/
          